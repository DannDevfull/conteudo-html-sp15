<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula15 - HTML</title>
    </head>

    <body>
        <h1>JavaScript no HTML</h1>

        <h3>Exemplo do elemento noscript no HTML</h3>

        <p id="meu-paragrafo"></p>

        <button onclick="adicionarConteudo()">Adicionar Conteúdo</button>


        <script>

            function adicionarConteudo(){
                document.getElementById("meu-paragrafo").innerHTML = "Somente a dor coletiva gera união";
            }

        </script>

        <noscript>Desculpe, seu JavaScript está desabilitado.</noscript>
        <!-- 
            Isso seria um texto alternativo para caso o JavaScript não está habilitado no lado do usuário
        -->
    </body>
</html>

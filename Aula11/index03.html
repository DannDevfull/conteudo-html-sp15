<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula11 - HTML</title>
</head>
<body>
    <h1>Listas de Descritivas</h1>
    <!-- Temos três tags 
     dl - define a lista descritiva
     dt Define o termo descritivo
     dd Descrição do termo
     -->

     <dl>
        <dt>Moto</dt>
        <dd>Veículo de duas rodas</dd>
        <dt>Carro</dt>
        <dd>Veículo de quatro rodas</dd>

     </dl>
</body>
</html>

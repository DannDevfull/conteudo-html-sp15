<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula10 - HTML</title>
</head>
<body>
    <h1>Definindo Mapas de imagens no HTML</h1>
    <img src="IMG/computer.jpg" alt="Mesa de trabalho" style="width: 400px; height: 379px;" usemap="#mesa-trabalho">

    <!--A tag Map torna a imagens, uma imagem com areas clicáveis -- Junto com a tag area que define quais são essas áreas clicáveis -->
    <map name="mesa-trabalho">
        <area shape="rect" coords="34, 44, 270, 350" href="computador.html" alt="" target="_blank">
        <area shape="rect" coords="290, 172, 335, 250" href="Celular.html" alt="" target="_blank">
        <area shape="circle" coords="337, 300, 44" href="Coffee.html" alt="" target="_blank">
    </map>
    <!-- Existem algumas maneiras de eu achar essas coodernadas:
        Achando-as no Figma
        Usando o Site Image Maps -->
</body>
</html>

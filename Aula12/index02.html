<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <title>Conteúdo Aula12 - HTML</title>

        <style>
            .city{
                background-color: tomato;
                border: 6px solid black;
                margin-bottom: 20px;
                padding-left: 20px;
                color: ghostwhite;
                font-family: sans-serif;   
            }
        </style>
    </head>

    <body>
        <h1>Atributo class no HTML</h1>
        <!-- 
            As class são classificaçõe que colocamos em tags,
            tornando-as um conjunto afim de estiliza-las em conjunto
        -->

        <div class="city">
            <h2>São Paulo</h2>
            <p>Capital de São Paulo</p>
        </div>

        <div class="city">
            <h2>Rio de Janeiro</h2>
            <p>Capital do Rio de Janeiro</p>
        </div>

        <div class="city">
            <h2>Natal</h2>
            <p>Capital do Rio Grande do Norte</p>
        </div>

    </body>
</html>

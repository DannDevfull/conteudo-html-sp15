<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula13 - HTML</title>

    <style>
        #Meu-H2{
            background-color: chocolate;
            color: rgba(139, 35, 35, 0.705);
            padding: 10px;
            border: 4px solid darkkhaki;
        }
    </style>
</head>
<body>
    <h1>ID no HTML</h1>
    <h2 id="Meu-H2">Eu sou um H2 com ID</h2>

    <hr>

    <h2>ID com JavaScript</h2>
    
    <h3 id="meu-h3">Turma SP15</h3>
    <button onclick="alterarConteudo()">Alterar conteúdo</button>

    <script>

        function alterarConteudo(){
            document.getElementById("meu-h3").innerHTML = "Somente a dor coletiva gera união"; 
            document.getElementById("meu-h3").style.color = "tomato";
            document.getElementById("meu-h3").style.fontSize = "30px";
            document.getElementById("meu-h3").style.backgroundColor = "gray";
        }

    </script>
</body>
</html>

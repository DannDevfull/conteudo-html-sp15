<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Conteúdo Aula13 - HTML</title>

        <style>
            .importante{
                color: tomato;
                font-weight: bold;
                font-size: 150%;
                /* A porcentagem é a maneira de definirmos um tamanho relativo em relação a tela e ao próprio elemento */
            }


            .cidades{
                background-color: darkmagenta;
                border: 6px solid darkorchid;
                /* Alem da solid, existe a dotted, */
                border-radius: 10px;
                color: ghostwhite;
                padding: 10px;
            }

            .centralizado{
                text-align: center;
            }

            .estilo{
                background-color: navy;
                color: aliceblue;
                padding: 10px;
                border: 4px solid goldenrod;
                border-radius: 10px;
            }

            
        </style>
    </head>

    <body>
        <h1>Class em HTML</h1>
        <h2>Título <span class="importante">importante</span> em HTML</h2>
        <p>Exemplo de conteúdo <span class="importante">importante</span> no HTML</p>
        <!--
         O span serve para estilizarmos partes específicas de um conteúdo, evitando mudar o conteúdo inteiro 
        -->

        <hr>

        <h3>Definindo mais de uma classe para elementos HTML</h3>

        <h2 class="cidades centralizado">São Paulo</h2>
        <!-- é possível um mesmo atributo class suportar várias classes.
         Quando eu separo por espaço temo duas classes em um mesmo elemento HTML -->
        <h2 class="cidades">Rio de Janeiro</h2>
        <h2 class="cidades">Natal</h2>

        <hr>

        <h3>Mesmas classes em elementos diferentes</h3>

        <h2 class="estilo">Eu sou um H2</h2>
        <p class="estilo">Eu sou um parágrafo</p>

        <hr>

        

       
    </body>
</html>

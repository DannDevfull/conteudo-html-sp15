<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Conteúdo Aula03 - HTML</title>

    <body>
        <h1>Atributos e elementos no HTML</h1>
        <p>Exemplo de atributo href:</p>
        <a href="https://www.w3schools.com">Clique aqui</a>
        
        <!--O elemento <a> significa Âncora, ou seja ele efine um hiperlink com a tributo, ou seja, uma caracteristica do elemento que adiciona informações e mudanças de comportamento ao elemento-->
       <hr>

        <p>Exemplo de atributo src (source), width, height e alt:</p>
        <img src="carros.jpg" alt="carro amarelo" width="250px" height="150">
        <!--src significa source, ou seja, a fonte, o caminho da imagem que para pega-la-->
        <!--alt, significa uma alternativa, ou seja, oferece uma descrição acerca da imagem caso a imagem quebre-->
        <hr>
        <p>Utilizando o atributo CSS: com certas propridades de CSS no HTML</p>
        <p>CSS no HMTL é chamada CSS unline(ou seja, na linha)</p>
        <!--propriedade  no CSS

            atributo no HTML

            abmos são as mesmas coisas

            css no HTML é CSS unline, que é um atributo que possui propriedades estilizando a tag

            : é igual a = finalizando com ; para que venha a proxima propriedade
        -->
        <p style="color: orange;">Esse texto é laranja</p>

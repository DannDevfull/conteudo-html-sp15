<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula09 - HTML</title>
    </head>

    <body>
        <h1>Definindo imagens no HTML</h1>

        <img src="./IMG/Código.jpg" alt="Códigos em uma tela"  width="300" height="200">

        <hr>

        <h2>Definindo a largura e a altura de imagem com CSS:</h2>
        <img src="./IMG/carros.jpg" alt="Carro amarelo"  style="width: 300px; height: 200px;">

        <hr>

        <h2>Utilizando imagens dinâmicas no HTML</h2>
        <img src="./IMG/cat.gif" alt="Gato animado andando" style="width:300px; height:200px ;">
        <hr>

        <h2>Utilizando imagem flutuantes</h2>
        <h3>Imagem flutuando para a direita</h3>

        <p>
            <img src="IMG/cat.gif" alt="" style="float: right;width: 100px; height: 100px;">
            Eis um gato andando e assoviando
        </p>
        

    </body>

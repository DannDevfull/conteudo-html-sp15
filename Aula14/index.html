<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula14 - HTML</title>
        <style>
            .btn1{
                background-color: rgba(0, 0, 0, 0.808);
                color: ghostwhite;
                border: none;
                font-size: 12px;
                font-family: monospace;
                font-weight: bold;
                border-radius: 6px;
                padding: 10px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>Botões no HTML</h1>

        <h2>Estilizando botões no HTML</h2>
        <button class="btn1">Clique aqui</button>

        <hr>

        <h3>Botão desativado</h3>
        <button disabled>Botão desativado</button>
        <hr>

        <h3>Botão com JavaScript</h3>
        <button onclick="alert('Você clicou nesse botão')" class="btn1">
            Clique aqui
        </button>
    </body>

</html>
